apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-security
  namespace: soc-platform
  labels:
    app: identity-security
    module: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-security
  template:
    metadata:
      labels:
        app: identity-security
    spec:
      containers:
      - name: identity-security
        image: socplatform/identity-security:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8013
        envFrom:
        - configMapRef:
            name: soc-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: database-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8013
        readinessProbe:
          httpGet:
            path: /health
            port: 8013
---
apiVersion: v1
kind: Service
metadata:
  name: identity-security
  namespace: soc-platform
spec:
  selector:
    app: identity-security
  ports:
  - port: 8013
    targetPort: 8013
  type: ClusterIP
