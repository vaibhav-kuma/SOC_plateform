apiVersion: apps/v1
kind: Deployment
metadata:
  name: edr-service
  namespace: soc-platform
  labels:
    app: edr-service
    module: edr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edr-service
  template:
    metadata:
      labels:
        app: edr-service
    spec:
      containers:
      - name: edr-service
        image: socplatform/edr-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8007
        envFrom:
        - configMapRef:
            name: soc-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: database-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8007
        readinessProbe:
          httpGet:
            path: /health
            port: 8007
---
apiVersion: v1
kind: Service
metadata:
  name: edr-service
  namespace: soc-platform
spec:
  selector:
    app: edr-service
  ports:
  - port: 8007
    targetPort: 8007
  type: ClusterIP
