apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-soc
  namespace: soc-platform
  labels:
    app: autonomous-soc
    module: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autonomous-soc
  template:
    metadata:
      labels:
        app: autonomous-soc
    spec:
      containers:
      - name: autonomous-soc
        image: socplatform/autonomous-soc:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8015
        envFrom:
        - configMapRef:
            name: soc-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: database-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8015
        readinessProbe:
          httpGet:
            path: /health
            port: 8015
---
apiVersion: v1
kind: Service
metadata:
  name: autonomous-soc
  namespace: soc-platform
spec:
  selector:
    app: autonomous-soc
  ports:
  - port: 8015
    targetPort: 8015
  type: ClusterIP
