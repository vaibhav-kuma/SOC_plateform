apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-copilot
  namespace: soc-platform
  labels:
    app: ai-copilot
    module: ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-copilot
  template:
    metadata:
      labels:
        app: ai-copilot
    spec:
      containers:
      - name: ai-copilot
        image: socplatform/ai-copilot:latest
        ports:
        - containerPort: 8013
        env:
        - name: LLM_PROVIDER
          value: "gemini"
        - name: GOOGLE_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: gemini-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: openai-api-key
        - name: ELASTICSEARCH_HOSTS
          value: '["elasticsearch.soc-data:9200"]'
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: redis-url
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8013
---
apiVersion: v1
kind: Service
metadata:
  name: ai-copilot
  namespace: soc-platform
spec:
  selector:
    app: ai-copilot
  ports:
  - port: 8013
    targetPort: 8013
  type: ClusterIP
