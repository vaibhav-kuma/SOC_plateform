apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-scanner
  namespace: soc-platform
  labels:
    app: vuln-scanner
    module: vuln-mgmt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vuln-scanner
  template:
    metadata:
      labels:
        app: vuln-scanner
    spec:
      containers:
      - name: vuln-scanner
        image: socplatform/vuln-scanner:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
        envFrom:
        - configMapRef:
            name: soc-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: database-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-scanner
  namespace: soc-platform
spec:
  selector:
    app: vuln-scanner
  ports:
  - port: 8003
    targetPort: 8003
  type: ClusterIP
