apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-security
  namespace: soc-platform
  labels:
    app: email-security
    module: email
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-security
  template:
    metadata:
      labels:
        app: email-security
    spec:
      containers:
      - name: email-security
        image: socplatform/email-security:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8014
        envFrom:
        - configMapRef:
            name: soc-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: database-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8014
        readinessProbe:
          httpGet:
            path: /health
            port: 8014
---
apiVersion: v1
kind: Service
metadata:
  name: email-security
  namespace: soc-platform
spec:
  selector:
    app: email-security
  ports:
  - port: 8014
    targetPort: 8014
  type: ClusterIP
