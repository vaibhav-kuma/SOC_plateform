apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-response
  namespace: soc-platform
  labels:
    app: incident-response
    module: ir
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-response
  template:
    metadata:
      labels:
        app: incident-response
    spec:
      containers:
      - name: incident-response
        image: socplatform/incident-response:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        envFrom:
        - configMapRef:
            name: soc-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: database-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
        readinessProbe:
          httpGet:
            path: /health
            port: 8005
---
apiVersion: v1
kind: Service
metadata:
  name: incident-response
  namespace: soc-platform
spec:
  selector:
    app: incident-response
  ports:
  - port: 8005
    targetPort: 8005
  type: ClusterIP
