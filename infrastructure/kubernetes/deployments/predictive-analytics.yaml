apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-analytics
  namespace: soc-platform
  labels:
    app: predictive-analytics
    module: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictive-analytics
  template:
    metadata:
      labels:
        app: predictive-analytics
    spec:
      containers:
      - name: predictive-analytics
        image: socplatform/predictive-analytics:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8016
        envFrom:
        - configMapRef:
            name: soc-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: database-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8016
        readinessProbe:
          httpGet:
            path: /health
            port: 8016
---
apiVersion: v1
kind: Service
metadata:
  name: predictive-analytics
  namespace: soc-platform
spec:
  selector:
    app: predictive-analytics
  ports:
  - port: 8016
    targetPort: 8016
  type: ClusterIP
