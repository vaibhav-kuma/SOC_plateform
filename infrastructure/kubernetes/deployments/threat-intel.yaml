apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-intel
  namespace: soc-platform
  labels:
    app: threat-intel
    module: intel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: threat-intel
  template:
    metadata:
      labels:
        app: threat-intel
    spec:
      containers:
      - name: threat-intel
        image: socplatform/threat-intel:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: soc-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: soc-secrets
              key: database-url
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: threat-intel
  namespace: soc-platform
spec:
  selector:
    app: threat-intel
  ports:
  - port: 8004
    targetPort: 8004
  type: ClusterIP
