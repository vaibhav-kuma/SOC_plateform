apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incident-response-hpa
  namespace: soc-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: incident-response
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
