apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vuln-scanner-hpa
  namespace: soc-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vuln-scanner
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
