global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'soc-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'host.docker.internal:8001'  # auth
        - 'host.docker.internal:8002'  # asset-discovery
        - 'host.docker.internal:8003'  # vuln-scanner
        - 'host.docker.internal:8004'  # edr
        - 'host.docker.internal:8006'  # threat-intel
        - 'host.docker.internal:8008'  # incident-response
        - 'host.docker.internal:8013'  # ai-copilot

  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
