input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["raw.events"]
    codec => json
    consumer_threads => 4
  }
}

filter {
  json {
    source => "message"
  }

  mutate {
    remove_field => ["@version", "message"]
  }

  if [event_type] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "events-%{+YYYY.MM.dd}"
      data_stream => false
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
    user => "${ELASTICSEARCH_USERNAME:-}"
    password => "${ELASTICSEARCH_PASSWORD:-}"
  }

  stdout {
    codec => rubydebug
    id => "debug_output"
  }
}
